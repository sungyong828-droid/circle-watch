# Cloudflare Pages 프로젝트 (공유용 주소 https://yongs-portfolio.pages.dev)
# 배포: dist 폴더를 만든 뒤 `npx wrangler pages deploy` (README 참고)
name = "yongs-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# 뉴스 한 줄 요약: Workers AI + 요약 보관(KV, Worker와 같은 저장소)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "SUMS"
id = "a8b6d687f1e140d38b1d720e20afb360"

# 방문자 통계(익명 기기 ID·날짜·유입 경로만, 개인 정보 없음) — 관리자 페이지 /admin 에서만 조회
[[d1_databases]]
binding = "STATS"
database_name = "yongs-portfolio-stats"
database_id = "38560b19-4d2e-4459-b7b9-7800e5cfbd9c"
