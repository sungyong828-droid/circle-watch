<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fire Portfolio로 이동 중</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1015;color:#e7ebf1;font:15px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;text-align:center;padding:24px}a{color:#e08a1e}</style>
</head>
<body>
<main>
<p><b>Fire Portfolio</b> 새 주소로 옮기는 중이에요…</p>
<p style="color:#8b95a5;font-size:13px">이 기기에 저장된 보유 정보·관심 종목·키워드도 함께 옮겨요.<br>자동으로 넘어가지 않으면 <a id="go" href="https://my-fire-portfolio.pages.dev/">여기</a>를 눌러 주세요.</p>
</main>
<script>
(function () {
  var NEW = 'https://my-fire-portfolio.pages.dev/';
  try {
    var data = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^cw\./.test(k) && !/^cw\.(adminKey|snapshot\.v1|kwNoti)$/.test(k)) { data[k] = localStorage.getItem(k); n++; }
    }
    if (!n) { location.replace(NEW); return; }
    var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = '';
    for (var j = 0; j < bytes.length; j += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 8192));
    var b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    location.replace(NEW + '#migrate=' + b64);
  } catch (e) { location.replace(NEW); }
})();
</script>
</body>
</html>
