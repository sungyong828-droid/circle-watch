# 금감원 DART가 GitHub 서버(해외)에서 접속되는지 한 번 확인(인증키 없이 — '등록되지 않은 인증키' 응답이 오면 접속 가능)
name: dart-probe
on:
  push:
    paths: ['.github/workflows/dart-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          r=$(curl -sS -m 30 "https://opendart.fss.or.kr/api/list.json?crtfc_key=0000000000000000000000000000000000000000" || true)
          echo "$r" | head -c 300
          echo "$r" | grep -q '"status":"010"'
