name: dart-sync (한국 종목 재무 자동 갱신)

# 매일 07:00(한국 시간) — 금감원 DART에서 분기 재무(비싼가 싼가)·손익 자세히(돈의 흐름)를 받아 Cloudflare KV에 올린다.
# PC가 꺼져 있어도 GitHub 서버에서 돈다. 새 보고서가 나온 회사만 다시 받고, 바뀐 KV 칸만 올린다(받은 기록은 Actions 캐시에 보관).
# 필요한 GitHub Secrets: DART_KEY(금감원 Open DART 인증키) · CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · (선택) DISCORD_WEBHOOK_URL
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:   # 스크립트를 고쳐도 자동으로 돌리지 않는다 — DART 인증키 하루 요청 한도(2만 번)를 아끼려고(하루 한 번만)

concurrency:
  group: dart-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 스크립트가 240분에 스스로 멈추고 받은 만큼 올린다(보고서가 몰리는 철에도 보통 한두 시간) — 그 뒤엔 새 보고서만이라 몇 분
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 지난번에 받은 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/cache/dart_codes.json
            tools/cache/dart_shares.json
            tools/cache/dart_is.json
            tools/cache/dart_kv_hash.json
          key: dart-cache2-${{ github.run_id }}
          restore-keys: dart-cache2-

      # 지난 분기들의 매출·순이익(5년치)은 한 번 받아 두고 다시 쓴다 — 매일 받는 건 최근 두세 분기뿐
      - name: 지난 보고서 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: tools/cache/dart_multi.json
          key: dart-multi1-${{ github.run_id }}
          restore-keys: dart-multi1-

      - name: DART → KV
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DART_KEY" ]; then echo "DART_KEY 비밀값이 아직 없어요 — 저장소 Settings → Secrets에 넣으면 다음부터 돌아요"; exit 0; fi
          mkdir -p tools/cache
          python tools/dart_sync.py

      # 중간에 시간이 다 돼 멈춰도 받은 만큼은 저장해 다음 실행이 이어서 받게(성공·실패와 상관없이)
      - name: 받은 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/cache/dart_codes.json
            tools/cache/dart_shares.json
            tools/cache/dart_is.json
            tools/cache/dart_kv_hash.json
          key: dart-cache2-${{ github.run_id }}

      - name: 지난 보고서 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/cache/dart_multi.json
          key: dart-multi1-${{ github.run_id }}

      - name: 실패하면 디스코드 알림
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$HOOK" ] && exit 0
          python3 -c "import json; print(json.dumps({'username':'Fire Portfolio','embeds':[{'title':'❌ 한국 종목 재무(DART) 자동 갱신 실패','description':'GitHub Actions 로그를 확인해 주세요.','color':15026253}]}))" > body.json
          curl -s -H 'Content-Type: application/json' -X POST -d @body.json "$HOOK" > /dev/null || true
        shell: bash
