name: biz-auto (종목 사업 현황 자동 갱신)

# 매주 월요일 06:00(한국 시간) — SEC·네이버에서 분기 실적을 다시 정리해 Cloudflare KV에 올린다. PC가 꺼져 있어도 GitHub 서버에서 돈다.
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN(Workers KV Storage:Edit) · CLOUDFLARE_ACCOUNT_ID · (선택) DISCORD_WEBHOOK_URL
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
  push:                       # 갱신 스크립트나 이 파일을 고치면 바로 한 번 돌려 확인
    branches: [main]
    paths: ['tools/biz_auto.py', '.github/workflows/biz-auto.yml']

permissions:
  contents: write

concurrency:
  group: biz-auto
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 사업 현황 다시 정리 → KV
        id: run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python tools/biz_auto.py | tee run.log
          echo "summary=$(grep -E '미국 [0-9]+개|한국 [0-9]+개' run.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: 새로 받은 회사 소개 저장(다음 주엔 새 종목만 받게)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/biz_desc
          git diff --cached --quiet || (git commit -m "biz-auto: update company descriptions" && git push) || true

      - name: 디스코드 알림
        if: always()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OK: ${{ job.status }}
          SUM: ${{ steps.run.outputs.summary }}
        run: |
          [ -z "$HOOK" ] && exit 0
          if [ "$OK" = "success" ]; then T="🏢 사업 현황 자동 갱신 완료"; C=4177791; else T="❌ 사업 현황 자동 갱신 실패"; C=15026253; fi
          export T C
          python3 -c "import json,os,sys; print(json.dumps({'username':'Fire Portfolio','embeds':[{'title':os.environ['T'],'description':os.environ.get('SUM','') or 'GitHub Actions 로그를 확인해 주세요.','color':int(os.environ['C'])}]}))" > body.json
          curl -s -H 'Content-Type: application/json' -X POST -d @body.json "$HOOK" > /dev/null || true
        shell: bash
