# DART 요청이 GitHub 서버에서 얼마나 걸리는지 한 번 재 본다(결과는 실행 알림 annotation으로 — 인증키는 출력하지 않음)
name: dart-timing
on:
  push:
    paths: ['.github/workflows/dart-timing.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          K: ${{ secrets.DART_KEY }}
        run: |
          t() { local s=$(date +%s.%N); local code=$(curl -s -o /tmp/o -w '%{http_code} %{size_download}' -m 120 "$1"); local e=$(date +%s.%N); echo "::notice::$2 → ${code} bytes, $(echo "$e - $s" | bc) s"; }
          B="https://opendart.fss.or.kr/api"
          t "$B/list.json?crtfc_key=$K&bgn_de=20261101&end_de=20261103&pblntf_ty=I&page_count=100" "list"
          t "$B/corpCode.xml?crtfc_key=$K" "corpCode zip"
          C=$(python3 -c "print(','.join(['00126380','00164779','00164742','00106641','00113526']*20))")
          t "$B/fnlttMultiAcnt.json?crtfc_key=$K&corp_code=00126380,00164779,00164742,00106641,00113526&bsns_year=2026&reprt_code=11012" "multiAcnt x5"
          t "$B/fnlttSinglAcntAll.json?crtfc_key=$K&corp_code=00126380&bsns_year=2026&reprt_code=11012&fs_div=CFS" "singleAcntAll"
          t "$B/stockTotqySttus.json?crtfc_key=$K&corp_code=00126380&bsns_year=2026&reprt_code=11012" "stockTotqy"
          for i in 1 2 3; do t "$B/fnlttSinglAcntAll.json?crtfc_key=$K&corp_code=00164779&bsns_year=2026&reprt_code=11012&fs_div=CFS" "singleAcntAll repeat $i"; done
