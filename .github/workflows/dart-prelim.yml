name: dart-prelim (한국 종목 잠정 실적 공시 확인)

# 3시간마다 — 금감원 DART '영업(잠정)실적(공정공시)'을 확인해 새 공시만 읽고, 바뀐 KV 칸만 올린다(PC가 꺼져 있어도 됨).
# 회사가 분기보고서보다 한 달쯤 먼저 내는 실적이라, 한국 종목의 돈의 흐름·실적 요약·사업 현황이 발표 당일 바뀐다.
# 필요한 GitHub Secrets: DART_KEY · CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · (선택) DISCORD_WEBHOOK_URL
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/dart_prelim.py', '.github/workflows/dart-prelim.yml']

concurrency:
  group: dart-prelim
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 지난번에 읽은 공시 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: tools/cache/dart_prelim.json
          key: dart-prelim-${{ github.run_id }}
          restore-keys: dart-prelim-

      - name: 잠정 실적 공시 → KV
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DART_KEY" ]; then echo "DART_KEY 비밀값이 없어요"; exit 0; fi
          mkdir -p tools/cache
          python tools/dart_prelim.py

      - name: 읽은 공시 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/cache/dart_prelim.json
          key: dart-prelim-${{ github.run_id }}

      - name: 실패하면 디스코드 알림
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$HOOK" ] && exit 0
          python3 -c "import json; print(json.dumps({'username':'Fire Portfolio','embeds':[{'title':'❌ 한국 잠정 실적(DART) 확인 실패','description':'GitHub Actions 로그를 확인해 주세요.','color':15026253}]}))" > body.json
          curl -s -H 'Content-Type: application/json' -X POST -d @body.json "$HOOK" > /dev/null || true
        shell: bash
